<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%" style="background-color: #050508;">
  <defs>
    <!-- Gradiente premium para SaaS -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0055FF" />
    </linearGradient>
    
    <!-- Sombra para dar efecto de "origami" o doblez 3D -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.4" flood-color="#000000" />
    </filter>
  </defs>

  <!-- VARIANTE 1: El Lazo Continuo (Origami Corporativo) -->
  <g transform="translate(0, 0)">
    <!-- Pata (Capa inferior) -->
    <path d="M 110,160 L 140,160 L 210,240 L 180,240 Z" fill="#0055FF" />
    <!-- Palo (Capa media) -->
    <path d="M 110,80 L 140,80 L 140,240 L 110,240 Z" fill="#00A8FF" filter="url(#shadow)" />
    <!-- Bucle (Capa superior) -->
    <path d="M 110,80 L 190,80 C 230,80 230,160 190,160 L 110,160 L 110,130 L 190,130 C 205,130 205,110 190,110 L 110,110 Z" fill="#00F0FF" filter="url(#shadow)" />
  </g>

  <!-- VARIANTE 2: El Stencil Técnico (Componentes Modulares / Limpio) -->
  <g transform="translate(0, 0)">
    <!-- Palo Vertical -->
    <line x1="395" y1="80" x2="395" y2="240" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" />
    <!-- Bucle Superior -->
    <path d="M 440,80 L 460,80 C 510,80 510,150 460,150 L 440,150" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" fill="none" />
    <!-- Pata Diagonal -->
    <line x1="435" y1="180" x2="495" y2="240" stroke="#00F0FF" stroke-width="30" stroke-linecap="round" />
  </g>

  <!-- VARIANTE 3: Los Servidores (Stack Literal / Estructura de Datos) -->
  <g transform="translate(0, 0)">
    <!-- Columna Izquierda (La "Roca" / Base sólida blanca) -->
    <rect x="700" y="70" width="32" height="24" rx="12" fill="#FFFFFF" />
    <rect x="700" y="102" width="32" height="24" rx="12" fill="#FFFFFF" />
    <rect x="700" y="134" width="32" height="24" rx="12" fill="#FFFFFF" />
    <rect x="700" y="166" width="32" height="24" rx="12" fill="#FFFFFF" />
    <rect x="700" y="198" width="32" height="24" rx="12" fill="#FFFFFF" />
    
    <!-- Lado Derecho (El "Stack" / Módulos dinámicos con degradado) -->
    <rect x="736" y="70" width="74" height="24" rx="12" fill="#00F0FF" />
    <rect x="778" y="102" width="32" height="24" rx="12" fill="#00D0FF" />
    <rect x="736" y="134" width="64" height="24" rx="12" fill="#00A8FF" />
    <rect x="756" y="166" width="32" height="24" rx="12" fill="#0080FF" />
    <rect x="778" y="198" width="32" height="24" rx="12" fill="#0055FF" />
  </g>
</svg>
